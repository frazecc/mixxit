<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>La Partita della Penombra</title>

  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>
  <header class="site-header">
    <div>
      <h1 class="site-title">⚔️ La Partita della Penombra</h1>

      <div class="site-subtitle">
        Motore PvE in arrivo
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel">
      <h2>Configurazione partita salvata</h2>

      <pre
        id="gameSetup"
        style="white-space:pre-wrap;color:var(--muted)"
      ></pre>

      <a class="button button--secondary" href="deckbuilder.html">
        Torna al Deckbuilder
      </a>
    </section>
  </main>

  <script>
    const raw =
      localStorage.getItem('penombra_pending_game');

    document.getElementById('gameSetup').textContent =
      raw
        ? raw
        : 'Nessuna configurazione partita trovata.';
  </script>
</body>
</html>
