<style>
:root{--bg:#0d1326;--panel:#1b2542;--gold:#f6ca58;--red:#ff707d;--blue:#61c5ff;--cyan:#68e4d3;--muted:#aeb8d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 5%,#26385e,#111a35 35%,#090e1d);color:#eef2ff;font-family:system-ui,Segoe UI,sans-serif;padding:8px;min-height:100vh}.layout{max-width:1220px;margin:auto;display:grid;grid-template-columns:235px minmax(0,760px);gap:12px;align-items:start}.main{min-width:0}.head{text-align:center;margin-bottom:5px}.head h1{font-size:1.4rem;margin:0;color:var(--gold)}.phase{font-size:.78rem;color:var(--muted)}.phase b{color:var(--gold)}.bar{display:flex;justify-content:space-between;align-items:center;background:#ffffff12;border-radius:8px;padding:6px 10px;margin:5px 0;cursor:pointer}.bar.mine{border-left:4px solid var(--blue)}.bar.enemy{border-left:4px solid var(--red)}.who{display:flex;align-items:center;gap:6px;font-size:.82rem}.badge{font-size:.62rem;border-radius:4px;padding:3px 5px;font-weight:900}.badge.mine{background:#194f78;color:#bde9ff}.badge.enemy{background:#71313f;color:#ffc0c6}.stats{display:flex;gap:11px}.stat{text-align:center;font-size:.62rem;color:var(--muted)}.stat b{display:block;font-size:1.05rem;color:var(--gold)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#080d1c;border-radius:9px;padding:6px;max-width:690px;margin:auto}.cell{aspect-ratio:1.18;background:#ffffff0d;border:2px solid #ffffff1f;border-radius:7px;position:relative;display:grid;place-items:center;cursor:pointer}.cell.mine-zone{box-shadow:inset 0 0 0 1px #61c5ff33}.cell.enemy-zone{box-shadow:inset 0 0 0 1px #ff707d33}.cell.valid{border-color:var(--gold);background:#f6ca582d}.cell.sacrifice{border-color:var(--red);background:#ff707d2b}.cell.ai-focus{border-color:var(--red)!important;box-shadow:0 0 0 2px #ff707daa,inset 0 0 20px #ff707d55;animation:focus 1s infinite}.cell.player-focus{border-color:var(--cyan)!important;box-shadow:0 0 0 2px #68e4d3aa,inset 0 0 20px #68e4d355;animation:fo id #354365;border-radius:9px;padding:8px}.logtitle{color:var(--gold);font-weight:900;font-size:.82rem;margin-bottom:6px}.log{height:470px;overflow:auto;padding-right:3px;font:12px/1.35 ui-monospace,monospace}.log div{border-left:3px solid var(--gold);padding:4px 6px;margin-bottom:4px;background:#ffffff08}.floating{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}button{border:0;border-radius:6px;background:linear-gradient(145deg,var(--gold),#e9992f);color:#17203a;padding:8px 11px;font-weight:900;cursor:pointer}.save{background:linear-gradient(145deg,var(--cyan),#399d98)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;place-items:center}.modal.open{display:grid}.dialog{max-width:410px;background:var(--panel);border:2px solid var(--gold);padding:18px;border-radius:10px;text-align:center}.dialog h2{color:var(--gold);font-size:1.1rem;margin:0 0 8px}.dialog p{font-size:.86rem;line-height:1.35}.dialog button{margin:3px}.menu{display:none;position:fixed;z-index:9;background:var(--panel);border:2px solid var(--gold);padding:5px;border-radius:7px}.menu.open{display:block}.menu button{display:block;width:100%;margin:3px 0;background:#f6ca5822;color:var(--gold);border:1px solid #f6ca5855}.banner{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:8;text-align:center;background:#111a31ee;border:2px solid var(--gold);border-radius:12px;padding:15px 28px;box-shadow:0 0 35px #000}.banner.show{animation:banner 1s ease}.banner strong{display:block;color:var(--gold);font-size:1.4rem}.banner span{color:#fff;font-size:.9rem}.bubble{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:7;background:#fff;color:#17203a;border-radius:14px;padding:9px 16px;font-weight:800;box-shadow:0 4px 16px #0009;opacity:0;pointer-events:none}.bubble.show{animation:bubble 1.9s ease}@keyframes bubble{0%{opacity:0;transform:translate(-50%,8px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}18%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}}@keyframes enterUnit{0%{transform:scale(.1) rotate(-12deg);opacity:0}55%{transform:scale(1.18) rotate(4deg);opacity:1;box-shadow:0 0 28px var(--red)}100%{transform:scale(1) rotate(0)}}@media(max-width:900px){.layout{grid-template-columns:1fr}.logbox{position:static;order:2}.log{height:180px}.main{order:1}.board{max-width:650px}}

<div class="layout"><aside class="logbox"><div class="logtitle">📜 Cronologia della partita</div><div class="log" id="log"></div></aside><main class="main"><div class="head"><h1>🌙 La Partita della Penombra</h1><div class="phase">Turno <b id="turn">1</b> · Fase: <b id="phase">Inizio</b></div></div><div class="bar enemy" id="iaBar" onclick="game.targetPlayer('ia')"><div class="who"><span class="badge enemy">IA</span><b>Avversario</b></div><div class="stats"><div class="stat"><b id="ihp">20</b>PV</div><div class="stat"><b id="im">0</b>Mana</div><div class="stat"><b id="id">0</b>Mazzo</div><div class="stat"><b id="ih">0</b>Mano</div></div></div><div class="board" id="board"></div><div class="bar mine" id="playerBar" onclick="game.targetPlayer('player')"><div class="who"><span class="badge mine">TU</span><b>Le tue risorse</b></div><div class="stats"><div class="stat"><b id="php">20</b>PV</div><div class="stat"><b id="pm">1</b>Mana</div><div class="stat"><b id="pd">0</b>Mazzo</div><div class="stat"><b id="ph">0</b>Mano</div></div></div><div class="section">EXTRA DECK · 2 sacrifici, nessun costo mana</div><div class="cards" id="extra"></div><div class="section">MANO</div><div class="cards" id="hand"></div><div class="instant-area" id="instantArea"><div class="instant-title">⚡ Scegli un istantaneo giocabile</div><div class="instant-cards" id="instantCards"></div></div></main></div>
<div class="menu" id="menu"></div><div class="modal" id="modal"><div class="dialog"><h2 id="mtitle"></h2><p id="mtext"></p><div id="mbuttons"></div></div></div><div class="banner" id="banner"><strong id="bannerTitle"></strong><span id="bannerPhase"></span></div><div class="bubble" id="bubble"></div><div class="floating"><button class="save" onclick="game.saveGame()">💾 Salva partita</button><button onclick="game.endTurn()">Fine turno</button></div>
<script>
const templates=[{name:'Esploratore',cost:1,forza:2,resistenza:2},{name:'Guerriero',cost:2,forza:3,resistenza:3},{name:'Arciere',cost:2,forza:3,resistenza:2},{name:'Mago',cost:3,forza:4,resistenza:2,etb:'draw'},{name:'Paladino',cost:4,forza:4,resistenza:4},{name:'Drago',cost:6,forza:6,resistenza:6},{name:'Cura',cost:1,type:'instant',effect:'heal',amount:2},{name:'Fuoco',cost:2,type:'instant',effect:'damage',amount:3}];
const extraTemplates=[{name:'Titano di Cenere',forza:7,resistenza:7},{name:'Serpe Abissale',forza:5,resistenza:6,etb:'draw2'},{name:'Drago Antico',forza:8,resistenza:6}];const copy=x=>JSON.parse(JSON.stringify(x));const wait=ms=>new Promise(r=>setTimeout(r,ms));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const game={turn:1,phase:'setup',history:[],targetMode:null,source:null,pendingInstant:null,selectedExtra:null,selectedSacrifices:[],player:null,ia:null,board:[],gameOver:false,entering:new Set(),aiFocus:[],instantDone:null,
init(){this.player=this.makePlayer('player');this.ia=this.makePlayer('ia');this.board=Array.from({length:9},(_,i)=>({row:Math.floor(i/3),col:i%3,owner:null,card:null}));for(let i=0;i<4;i++){this.draw('player',false);this.draw('ia',false)}this.startPlayerTurn()},makePlayer(owner){let deck=[];for(let i=0;i<20;i++)deck.push({...copy(templates[Math.floor(Math.random()*templates.length)]),id:owner+i});return{owner,hp:20,mana:0,maxMana:0,deck:shuffle(deck),hand:[],graveyard:[],extraDeck:extraTemplates.map((c,i)=>({...copy(c),id:owner+'x'+i}))}},log(s){let d=document.createElement('div');d.textContent=s;let l=document.getElementById('log');l.append(d);l.scrollTop=l.scrollHeight},record(type,data){this.history.push({turn:this.turn,phase:this.phase,type,data:copy(data),timestamp:new Date().toISOString()})},say(s){let b=document.getElementById('bubble');b.textContent=s;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');this.log('💬 '+s)},banner(title,phase){let b=document.getElementById('banner');document.getElementById('bannerTitle').textContent=title;document.getElementById('bannerPhase').textContent=phase;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')},async showPhase(owner,phase){this.phase=owner==='ia'?'ia_'+phase:phase;this.render();this.banner(owner==='ia'?'TURNO AVVERSARIO':'IL TUO TURNO',phase[0].toUpperCase()+phase.slice(1));this.say(`${owner==='ia'?'Turno avversario':'Il tuo turno'}: ${phase}`);await wait(1000)},focus(indices){this.aiFocus=indices.filter(i=>i!==null&&i!==undefined);this.render()},clearFocus(){this.aiFocus=[];this.render()},draw(who,announce=true){let p=this[who];if(!p.deck.length){p.hp-=2;if(announce)this.say(`${who==='player'?'Tu':'IA'}: mazzo vuoto, -2 PV`);this.record('exhaustion',{who,damage:2});this.checkEnd();return}let c=p.deck.pop();p.hand.push(c);this.record('draw',{who,card:c.name});if(announce)this.say(who==='player'?`Pesco una carta: ${c.name}`:'L’IA pesca una carta')},
async startPlayerTurn(){if(this.gameOver)return;this.player.maxMana=Math.min(10,this.turn);this.player.mana=this.player.maxMana;this.board.forEach(x=>{if(x.owner==='player'&&x.card)x.card.tired=false});this.record('turn_start',{who:'player',mana:this.player.mana});await this.showPhase('player','inizio turno');await this.showPhase('player','mana');await this.showPhase('player','manomissione');await this.runManipulation('player');await this.showPhase('player','pesca');this.draw('player');await wait(1000);this.phase='principale';this.banner('IL TUO TURNO','Fase principale / combattimento');this.say('Ora puoi evocare, muovere e attaccare');this.render()},canInstant(who){return this[who].hand.some(c=>c.type==='instant'&&c.cost<=this[who].mana)},async runManipulation(turnOwner){let active=turnOwner,passes=0;while(passes<2&&!this.gameOver){if(active==='ia'){if(this.aiShouldInstant()){await this.iaInstantSequence();passes=0}else{this.say('L’IA passa priorità');passes++}}else{if(this.canInstant('player')){let used=await this.askPlayerInstant('Manomissione: vuoi giocare un istantaneo?');passes=used?0:passes+1}else passes++}active=active==='player'?'ia':'player'}},askPlayerInstant(text){return new Promise(resolve=>{this.showModal('Manomissione',text,[{text:'Passa',action:()=>{this.hideModal();resolve(false)}},{text:'Scegli carta',action:()=>{this.hideModal();this.openInstantArea(()=>resolve(true))}}])})},openInstantArea(done){document.getElementById('instantArea').classList.add('open');this.instantDone=()=>{document.getElementById('instantArea').classList.remove('open');if(done)done()};this.renderInstantCards()},renderInstantCards(){let box=document.getElementById('instantCards');box.innerHTML='';this.player.hand.forEach((c,i)=>{if(c.type!=='instant'||c.cost>this.player.mana)return;let e=document.createElement('button');e.className='instant-card';e.innerHTML=`⚡ <b>${c.name}</b><br><small>${c.cost} mana</small>`;e.onclick=()=>this.beginInstant(i);box.append(e)})},beginInstant(i){let c=this.player.hand[i];if(!c||c.type!=='instant'||c.cost>this.player.mana)return;this.pendingInstant={index:i,card:c};this.targetMode=c.effect==='heal'?'healTarget':'damageTarget';this.say(`Scegli il bersaglio di ${c.name}`);document.getElementById('instantArea').classList.remove('open');this.render()},targetPlayer(who){if(this.targetMode==='healTarget'&&who==='player')this.resolvePlayerInstantTarget('player');if(this.targetMode==='damageTarget'&&who==='ia')this.resolvePlayerInstantTarget('ia')},resolvePlayerInstantTarget(target){let p=this.pendingInstant;if(!p)return;let card=this.player.hand[p.index];if(!card)return;this.player.mana-=card.cost;this.player.hand.splice(p.index,1);this.player.graveyard.push(card);if(card.effect==='heal'){this[target].hp+=card.amount;this.say(`Cura: ${target==='player'?'tu':'IA'} recupera ${card.amount} PV`)}else{this[target].hp-=card.amount;this.say(`Fuoco: ${target==='ia'?'IA':'tu'} subisce ${card.amount} danni`)}this.record('play_instant',{owner:'player',card:card.name,target});this.pendingInstant=null;this.targetMode=null;this.render();this.checkEnd();if(this.instantDone){let f=this.instantDone;this.instantDone=null;f()}},targetUnit(i){if(!this.pendingInstant)return;let x=this.board[i],c=this.pendingInstant.card;if(c.effect==='heal'&&x.owner!=='player')return;if(c.effect==='damage'&&x.owner!=='ia')return;let card=this.player.hand[this.pendingInstant.index];this.player.mana-=card.cost;this.player.hand.splice(this.pendingInstant.index,1);this.player.graveyard.push(card);if(c.effect==='heal'){x.card.resistenza+=c.amount;this.say(`Cura: ${x.card.name} recupera ${c.amount} RESISTENZA`)}else{x.card.resistenza-=c.amount;this.say(`Fuoco: ${x.card.name} subisce ${c.amount} danni`);if(x.card.resistenza<=0)this.kill(i)}this.record('play_instant',{owner:'player',card:card.name,target:x.card?x.card.name:'creatura'});this.pendingInstant=null;this.targetMode=null;this.render();this.checkEnd();if(this.instantDone){let f=this.instantDone;this.instantDone=null;f()}},
playFromHand(i){if(this.phase!=='principale')return;let c=this.player.hand[i];if(!c)return;if(c.type==='instant')return this.beginInstant(i);if(c.cost>this.player.mana)return this.log('❌ Mana insufficiente');let free=this.board.some((x,j)=>j>=6&&j<=8&&!x.card);if(!free){this.say('❌ Non ci sono zone iniziali libere: evocazione annullata');return}this.targetMode='summon';this.source=i;this.say(`Gioco ${c.name}: scegli la zona iniziale`);this.render()},summonTo(i){if(i<6||i>8||this.board[i].card)return;let c=this.player.hand[this.source];this.player.mana-=c.cost;this.player.hand.splice(this.source,1);this.board[i].card={...c,tired:true,maxResistenza:c.resistenza};this.board[i].owner='player';this.entering.add(i);this.record('play_monster',{card:c.name,cost:c.cost,position:`R${this.board[i].row}C${this.board[i].col}`});this.say(`Evoco ${c.name} nella mia zona iniziale`);this.targetMode=null;this.source=null;this.render();setTimeout(()=>{this.entering.delete(i);this.render()},1000);if(c.etb)this.resolveETB('player',c)},resolveETB(owner,c){this.showModal('ETB attivato',`${c.name}: ${c.etb==='draw'?'pesca 1 carta':'pesca 2 carte'}.`,[{text:'Continua',action:()=>{this.hideModal();if(c.etb==='draw')this.draw(owner);if(c.etb==='draw2'){this.draw(owner);this.draw(owner)}this.render()}}])},
openUnitMenu(i,e){if(this.phase!=='principale')return;let x=this.board[i];if(x.owner!=='player'||!x.card||x.card.tired)return;let target=this.attackTarget(i,'player'),m=document.getElementById('menu');m.innerHTML=`<button onclick="game.beginMove(${i})">🚶 Sposta (1 mana)</button>${target?`<button onclick="game.beginAttack(${i})">⚔️ Attacca</button>`:''}`;m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';m.classList.add('open')},beginMove(i){document.getElementById('menu').classList.remove('open');if(this.player.mana<1)return this.log('❌ Mana insufficiente');if(!this.moves(i,'player').length)return this.log('❌ Nessun movimento possibile');this.targetMode='move';this.source=i;this.render()},moves(i,owner){let x=this.board[i],out=[],forward=owner==='player'?-3:3;if(x.row+(owner==='player'?-1:1)>=1&&x.row+(owner==='player'?-1:1)<=1&&this.board[i+forward]&&!this.board[i+forward].card)out.push(i+forward);if(x.col>0&&!this.board[i-1].card)out.push(i-1);if(x.col<2&&!this.board[i+1].card)out.push(i+1);return out},moveTo(i){let f=this.board[this.source],t=this.board[i];t.card=f.card;t.owner=f.owner;f.card=null;f.owner=null;this.player.mana--;this.record('move',{card:t.card.name,from:`R${f.row}C${f.col}`,to:`R${t.row}C${t.col}`,manaCost:1});this.say(`${t.card.name}: mi sposto`);this.targetMode=null;this.source=null;this.render()},beginAttack(i){document.getElementById('menu').classList.remove('open');let target=this.attackTarget(i,'player');if(!target)return;if(target.type==='direct'||target.type==='unit'){this.source=i;return this.resolveAttack(i,target,'player)}},attackTarget(i,owner){let x=this.board[i],dir=owner==='player'?-1:1,enemy=owner==='player'?'ia':'player';for(let r=x.row+dir;r>=0&&r<=2;r+=dir){let y=this.board[r*3+x.col];if(y.card)return y.owner===enemy?{type:'unit',index:r*3+x.col}:null}return x.row===1?{type:'direct'}:null},resolveAttack(source,target,owner){let a=this.board[source];if(!a.card)return;if(target.type==='direct'){let foe=owner==='player'?'ia':'player';this[foe].hp-=a.card.forza;this.say(`${a.card.name}: attacco diretto per ${a.card.forza}`);this.record('attack_direct',{owner,attacker:a.card.name,damage:a.card.forza})}else{let d=this.board[target.index];this.say(`${a.card.name} attacca ${d.card.name}`);d.card.resistenza-=a.card.forza;this.record('attack_resolve',{owner,attacker:a.card.name,defender:d.card.name,damage:a.card.forza});if(d.card.resistenza<=0)this.kill(target.index)}a.card.tired=true;this.checkEnd();this.render()},kill(i){let x=this.board[i],c=x.card;this[x.owner].graveyard.push(c);this.say(`${c.name} viene distrutto`);this.record('creature_death',{card:c.name,owner:x.owner,position:`R${x.row}C${x.col}`});x.card=null;x.owner=null},
selectExtra(i){if(this.phase!=='principale')return;let own=this.board.filter(x=>x.owner==='player'&&x.card).length;if(own<2){this.say('❌ Servono 2 creature da sacrificare');return}this.selectedExtra=i;this.targetMode='sacrifice';this.selectedSacrifices=[];this.say('Seleziona 2 creature da sacrificare');this.render()},sacrifice(i){let x=this.board[i];if(x.owner!=='player'||!x.card)return;let p=this.selectedSacrifices.indexOf(i);if(p>=0)this.selectedSacrifices.splice(p,1);else if(this.selectedSacrifices.length<2)this.selectedSacrifices.push(i);if(this.selectedSacrifices.length===2){let c=this.player.extraDeck[this.selectedExtra],names=this.selectedSacrifices.map(j=>this.board[j].card.name);this.selectedSacrifices.forEach(j=>this.kill(j));this.player.extraDeck.splice(this.selectedExtra,1);this.pendingExtra={card:c,names};this.selectedSacrifices=[];this.targetMode='extraDestination';this.say('Sacrifici effettuati: scegli la zona iniziale, anche appena liberata')}this.render()},extraTo(i){if(i<6||i>8||this.board[i].card||!this.pendingExtra)return;let c=this.pendingExtra.card;this.board[i].card={...c,tired:true,maxResistenza:c.resistenza};this.board[i].owner='player';this.entering.add(i);this.record('summon_extra',{card:c.name,cost:0,sacrifices:this.pendingExtra.names,position:`R${this.board[i].row}C${this.board[i].col}`});this.say(`Evoco ${c.name} dall’Extra Deck`);this.targetMode=null;this.selectedExtra=null;this.pendingExtra=null;this.render();setTimeout(()=>{this.entering.delete(i);this.render()},1000)},
endTurn(){if(this.phase!=='principale'||this.gameOver)return;this.banner('IL TUO TURNO','Fine turno');this.say('Termino il turno');while(this.player.hand.length>7){let i=Math.floor(Math.random()*this.player.hand.length),c=this.player.hand.splice(i,1)[0];this.player.graveyard.push(c);this.record('discard',{owner:'player',card:c.name,reason:'hand_limit'})}this.record('end_turn',{owner:'player'});setTimeout(()=>this.runIATurn(),1000)},
async runIATurn(){if(this.gameOver)return;this.board.forEach(x=>{if(x.owner==='ia'&&x.card)x.card.tired=false});this.ia.maxMana=Math.min(10,this.turn);this.ia.mana=this.ia.maxMana;this.record('turn_start',{who:'ia',mana:this.ia.mana});await this.showPhase('ia','inizio turno');await this.showPhase('ia','mana');await this.showPhase('ia','manomissione');await this.runManipulation('ia');await this.showPhase('ia','pesca');this.draw('ia');await wait(1000);await this.showPhase('ia','fase principale');await this.iaPlaySequence();await this.showPhase('ia','combattimento');await this.iaCombatSequence();await this.showPhase('ia','fine turno');while(this.ia.hand.length>7){let i=Math.floor(Math.random()*this.ia.hand.length);this.ia.graveyard.push(this.ia.hand.splice(i,1)[0])}this.turn++;await this.startPlayerTurn()},

async iaPlaySequence(){let slot=this.board.slice(0,3).findIndex(x=>!x.card),choices=this.ia.hand.map((c,i)=>({c,i})).filter(x=>!x.c.type&&x.c.cost<=this.ia.mana).sort((a,b)=>b.c.cost-a.c.cost);if(slot<0||!choices.length){this.say('L’IA non gioca creature');await wait(1000);return}let {c,i}=choices[0];this.say(`L’IA prepara ${c.name}`);await wait(1000);this.ia.hand.splice(i,1);this.ia.mana-=c.cost;this.board[slot].card={...c,tired:true,maxResistenza:c.resistenza};this.board[slot].owner='ia';this.entering.add(slot);this.focus([slot]);this.record('ia_play_monster',{card:c.name,position:`R0C${slot}`});this.say(`L’IA evoca ${c.name} nella riga superiore`);this.render();await wait(1000);this.entering.delete(slot);this.clearFocus();await this.playerResponseWindow(`L’IA ha evocato ${c.name}`);await wait(1000)},

async iaCombatSequence(){let units=this.board.map((cell,index)=>({cell,index})).filter(x=>x.cell.owner==='ia'&&x.cell.card&&!x.cell.card.tired);if(!units.length){this.say('L’IA non ha creature pronte per attaccare');await wait(1000);return}for(let item of units){if(this.gameOver)return;let i=item.index,x=this.board[i],target=this.attackTarget(i,'ia');if(!target&&this.ia.mana>=1&&x.row===0){let next=i+3;if(!this.board[next].card){this.focus([i,next]);this.say(`L’IA muove ${x.card.name} verso il centro`);await wait(1000);this.board[next].card=x.card;this.board[next].owner='ia';x.card=null;x.owner=null;this.ia.mana--;i=next;this.record('ia_move',{card:this.board[i].card.name,to:`R1C${this.board[i].col}`});this.render();await wait(1000);this.clearFocus();target=this.attackTarget(i,'ia')}}if(target){let ti=target.type==='unit'?target.index:null;this.focus([i,ti]);this.say(`L’IA dichiara un attacco con ${this.board[i].card.name}`);await wait(1000);await this.playerResponseWindow('L’IA ha dichiarato un attacco');this.resolveAttack(i,target,'ia');await wait(1000);this.clearFocus()}}},
checkEnd(){if(this.gameOver)return true;if(this.player.hp<=0){this.finish('Sconfitta','L’IA ha vinto.');return true}if(this.ia.hp<=0){this.finish('Vittoria','Hai sconfitto l’IA.');return true}return false},finish(title,text){this.gameOver=true;this.phase='partita conclusa';this.banner(title,text);this.showModal(title,text,[{text:'💾 Salva partita',action:()=>this.saveGame()},{text:'Chiudi',action:()=>this.hideModal()},{text:'Nuova partita',action:()=>location.reload()}])},
render(){document.getElementById('turn').textContent=this.turn;document.getElementById('phase').textContent=this.phase;[['php',this.player.hp],['pm',this.player.mana],['pd',this.player.deck.length],['ph',this.player.hand.length],['ihp',this.ia.hp],['im',this.ia.mana],['id',this.ia.deck.length],['ih',this.ia.hand.length]].forEach(([id,v])=>document.getElementById(id).textContent=v);document.getElementById('iaBar').classList.toggle('player-focus',this.targetMode==='damageTarget');document.getElementById('playerBar').classList.toggle('player-focus',this.targetMode==='healTarget');let b=document.getElementById('board');b.innerHTML='';this.board.forEach((x,i)=>{let e=document.createElement('div');e.className='cell '+(x.row===2?'mine-zone':x.row===0?'enemy-zone':'');let valid=(this.targetMode==='summon'&&i>=6&&i<=8&&!x.card)||(this.targetMode==='move'&&this.moves(this.source,'player').includes(i))||(this.targetMode==='extraDestination'&&i>=6&&i<=8&&!x.card)||(this.targetMode==='healTarget'&&x.owner==='player'&&x.card)||(this.targetMode==='damageTarget'&&x.owner==='ia'&&x.card);if(valid)e.classList.add('valid');if(this.targetMode==='sacrifice'&&x.owner==='player'&&x.card)e.classList.add('sacrifice');if(this.aiFocus.includes(i))e.classList.add('ai-focus');e.innerHTML=`<span class="label">${x.row===0?'IA · AVVERSARIO':x.row===1?'CENTRO':'TU · LE TUE ZONE'} · ${x.col+1}</span>`;if(x.card)e.innerHTML+=`<div class="unit ${x.owner==='ia'?'ia':''} ${x.card.tired?'tired':''} ${this.entering.has(i)?'entering':''}"><div class="name">${x.card.name}</div><div class="unitstats"><span class="atk">⚔${x.card.forza}</span> <span class="hp">🛡${x.card.resistenza}</span></div></div>`;e.onclick=ev=>this.cellClick(i,ev);b.append(e)});let h=document.getElementById('hand');h.innerHTML='';this.player.hand.forEach((c,i)=>{let e=document.createElement('div');e.className='card '+(c.type==='instant'&&c.cost<=this.player.mana?'playable':'');e.innerHTML=`<b>${c.name}</b><br><small>💎 ${c.cost} ${c.type?'· ⚡':''}</small>${c.forza?`<br>⚔${c.forza} 🛡${c.resistenza}`:''}`;e.onclick=()=>this.playFromHand(i);h.append(e)});let ex=document.getElementById('extra');ex.innerHTML='';this.player.extraDeck.forEach((c,i)=>{let e=document.createElement('div');e.className='card extra';e.innerHTML=`<b>${c.name}</b><br><small>✨ 2 sacrifici</small><br>⚔${c.forza} 🛡${c.resistenza}`;e.onclick=()=>this.selectExtra(i);ex.append(e)});if(document.getElementById('instantArea').classList.contains('open'))this.renderInstantCards()},cellClick(i,e){document.getElementById('menu').classList.remove('open');if(this.targetMode==='summon')return this.summonTo(i);if(this.targetMode==='move')return this.moves(this.source,'player').includes(i)&&this.moveTo(i);if(this.targetMode==='healTarget'||this.targetMode==='damageTarget')return this.targetUnit(i);if(this.targetMode==='sacrifice')return this.sacrifice(i);if(this.targetMode==='extraDestination')return this.extraTo(i);if(this.board[i].owner==='player')this.openUnitMenu(i,e)},showModal(t,txt,buttons){document.getElementById('mtitle').textContent=t;document.getElementById('mtext').textContent=txt;let b=document.getElementById('mbuttons');b.innerHTML='';buttons.forEach(x=>{let q=document.createElement('button');q.textContent=x.text;q.onclick=x.action;b.append(q)});document.getElementById('modal').classList.add('open')},hideModal(){document.getElementById('modal').classList.remove('open')},saveGame(){let data={version:'4.0',timestamp:new Date().toISOString(),turn:this.turn,phase:this.phase,player:copy(this.player),ia:copy(this.ia),board:copy(this.board),moveHistory:copy(this.history)};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`penombra_partita_turno${this.turn}.json`;a.click();URL.revokeObjectURL(a.href);this.log('💾 Partita salvata.')}};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('.unit'))document.getElementById('menu').classList.remove('open')});game.init();
