<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Partita della Penombra</title>
<style>
:root{--bg:#12172b;--panel:#202846;--gold:#f6ca58;--red:#ef6f76;--blue:#68d7d0;--muted:#aeb8d4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0e1325,#1c2744);color:#eef2ff;font-family:system-ui,Segoe UI,sans-serif;padding:10px;min-height:100vh}.game{max-width:920px;margin:auto}.head{text-align:center;margin-bottom:8px}.head h1{font-size:1.45rem;margin:0;color:var(--gold)}.phase{font-size:.85rem;color:var(--muted)}.phase b{color:var(--gold)}.bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border-radius:8px;padding:7px 12px;margin:7px 0}.stats{display:flex;gap:13px}.stat{text-align:center;font-size:.7rem;color:var(--muted)}.stat b{display:block;font-size:1.1rem;color:var(--gold)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#0c1020;border-radius:10px;padding:9px}.cell{aspect-ratio:1;background:rgba(255,255,255,.055);border:2px solid rgba(255,255,255,.12);border-radius:8px;position:relative;display:grid;place-items:center;cursor:pointer}.cell.valid{border-color:var(--gold);background:rgba(246,202,88,.17)}.cell.sacrifice{border-color:var(--red);background:rgba(239,111,118,.16)}.label{position:absolute;top:3px;left:6px;font-size:.62rem;color:#8791ae}.unit{width:84%;height:84%;border:2px solid var(--gold);border-radius:6px;background:linear-gradient(145deg,#303b61,#171d35);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3px;text-align:center;font-size:.69rem}.unit.ia{border-color:#e98793}.unit.tired{filter:grayscale(.7);opacity:.58}.name{font-weight:700;color:var(--gold);line-height:1.05}.ia .name{color:#ffabb4}.unitstats{margin-top:4px}.atk{color:var(--red)}.hp{color:var(--blue)}.section{font-size:.72rem;color:var(--muted);margin:8px 0 3px}.cards{display:flex;gap:6px;overflow-x:auto;background:rgba(0,0,0,.22);padding:7px;border-radius:8px}.card{flex:0 0 92px;min-height:64px;background:linear-gradient(145deg,#303b61,#171d35);border:2px solid #5f6c96;border-radius:6px;padding:5px;cursor:pointer;font-size:.7rem}.card:hover,.card.selected{border-color:var(--gold);transform:translateY(-2px)}.extra{background:linear-gradient(145deg,#51422e,#262038);border-color:var(--gold)}.card small{color:var(--muted)}.log{height:92px;overflow:auto;margin-top:8px;padding:6px;background:rgba(0,0,0,.25);border-radius:8px;font:11px ui-monospace,monospace}.log div{border-left:2px solid var(--gold);padding:2px 5px;margin-bottom:3px}.floating{position:fixed;right:13px;bottom:13px;display:flex;flex-direction:column;gap:7px}button{border:0;border-radius:6px;background:linear-gradient(145deg,var(--gold),#e9992f);color:#17203a;padding:9px 12px;font-weight:800;cursor:pointer}.save{background:linear-gradient(145deg,var(--blue),#3a9e99)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10;place-items:center}.modal.open{display:grid}.dialog{max-width:390px;background:var(--panel);border:2px solid var(--gold);padding:20px;border-radius:10px;text-align:center}.dialog h2{color:var(--gold);font-size:1.1rem;margin:0 0 10px}.dialog p{font-size:.9rem;line-height:1.4}.dialog button{margin:3px}.menu{display:none;position:fixed;z-index:9;background:var(--panel);border:2px solid var(--gold);padding:6px;border-radius:8px}.menu.open{display:block}.menu button{display:block;width:100%;margin:3px 0;background:rgba(246,202,88,.15);color:var(--gold);border:1px solid rgba(246,202,88,.35)}
</style>
</head>
<body>
<div class="game"><div class="head"><h1>🌙 La Partita della Penombra</h1><div class="phase">Turno <b id="turn">1</b> · Fase: <b id="phase">Manomissione</b></div></div><div class="bar"><b>IA</b><div class="stats"><div class="stat"><b id="ihp">20</b>PV</div><div class="stat"><b id="im">0</b>Mana</div><div class="stat"><b id="id">0</b>Mazzo</div><div class="stat"><b id="ih">0</b>Mano</div></div></div><div class="board" id="board"></div><div class="bar"><b>Tu</b><div class="stats"><div class="stat"><b id="php">20</b>PV</div><div class="stat"><b id="pm">1</b>Mana</div><div class="stat"><b id="pd">0</b>Mazzo</div><div class="stat"><b id="ph">0</b>Mano</div></div></div><div class="section">EXTRA DECK · 2 sacrifici, nessun costo mana</div><div class="cards" id="extra"></div><div class="section">MANO</div><div class="cards" id="hand"></div><div class="log" id="log"></div></div>
<div class="menu" id="menu"></div><div class="modal" id="modal"><div class="dialog"><h2 id="mtitle"></h2><p id="mtext"></p><div id="mbuttons"></div></div></div><div class="floating"><button class="save" onclick="game.saveGame()">💾 Salva partita</button><button onclick="game.endTurn()">Fine turno</button></div>
<script>
const templates=[{name:'Esploratore',cost:1,forza:2,resistenza:2},{name:'Guerriero',cost:2,forza:3,resistenza:3},{name:'Arciere',cost:2,forza:3,resistenza:2},{name:'Mago',cost:3,forza:4,resistenza:2,etb:'draw'},{name:'Paladino',cost:4,forza:4,resistenza:4},{name:'Drago',cost:6,forza:6,resistenza:6},{name:'Cura',cost:1,type:'instant',effect:'heal_player',amount:2},{name:'Fuoco',cost:2,type:'instant',effect:'damage_player',amount:3}];
const extraTemplates=[{name:'Titano di Cenere',forza:7,resistenza:7},{name:'Serpe Abissale',forza:5,resistenza:6,etb:'draw2'},{name:'Drago Antico',forza:8,resistenza:6}];
const copy=x=>JSON.parse(JSON.stringify(x));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const game={turn:1,phase:'setup',history:[],targetMode:null,source:null,selectedExtra:null,selectedSacrifices:[],player:null,ia:null,board:[],
init(){this.player=this.makePlayer('player');this.ia=this.makePlayer('ia');this.board=Array.from({length:9},(_,i)=>({row:Math.floor(i/3),col:i%3,owner:null,card:null}));for(let i=0;i<4;i++){this.draw('player');this.draw('ia')}this.startPlayerTurn()},
makePlayer(owner){let deck=[];for(let i=0;i<20;i++)deck.push({...copy(templates[Math.floor(Math.random()*templates.length)]),id:owner+i});return{owner,hp:20,mana:0,maxMana:0,deck:shuffle(deck),hand:[],graveyard:[],extraDeck:extraTemplates.map((c,i)=>({...copy(c),id:owner+'x'+i}))}},
log(s){let d=document.createElement('div');d.textContent=s;let l=document.getElementById('log');l.append(d);l.scrollTop=l.scrollHeight},record(type,data){this.history.push({turn:this.turn,phase:this.phase,type,data:copy(data),timestamp:new Date().toISOString()})},
draw(who){let p=this[who];if(!p.deck.length){p.hp-=2;this.log(`⚠️ ${who==='player'?'Tu':'IA'}: mazzo vuoto, -2 PV`);this.record('exhaustion',{who,damage:2});this.checkEnd();return}let c=p.deck.pop();p.hand.push(c);this.record('draw',{who,card:c.name});if(who==='player')this.log(`📥 Peschi ${c.name}`)},
startPlayerTurn(){this.phase='mana';this.player.maxMana=Math.min(10,this.turn);this.player.mana=this.player.maxMana;this.board.forEach(x=>{if(x.owner==='player'&&x.card)x.card.tired=false});this.record('turn_start',{who:'player',mana:this.player.mana});this.phase='manomissione';this.log(`🌙 Turno ${this.turn}: Manomissione`);this.runManipulation(()=>{this.phase='pesca';this.draw('player');this.phase='principale';this.log('⚔️ Fase principale');this.render()})},
canInstant(who){return this[who].hand.some(c=>c.type==='instant'&&c.cost<=this[who].mana)},
runManipulation(done){let passes=0,ask=who=>{if(!this.canInstant(who)){passes++;if(passes>=2)return done();return ask(who==='player'?'ia':'player')}this.showModal('Manomissione',`${who==='player'?'Vuoi':'L’IA vuole'} giocare un istantaneo?`,[{text:'Passa',action:()=>{this.hideModal();passes++;if(passes>=2)done();else ask(who==='player'?'ia':'player')}},{text:'Gioca istantaneo',action:()=>{this.hideModal();if(who==='ia')this.iaInstant();else this.choosePlayerInstant();passes=0;ask(who==='player'?'ia':'player')}}])};ask('player')},
choosePlayerInstant(){let choices=this.player.hand.map((c,i)=>({c,i})).filter(x=>x.c.type==='instant'&&x.c.cost<=this.player.mana);if(!choices.length)return;this.showModal('Manomissione','Scegli l’istantaneo da giocare.',choices.map(x=>({text:`${x.c.name} · ${x.c.cost} mana`,action:()=>{this.hideModal();this.playFromHand(x.i)}})))},
playFromHand(i){if(this.phase!=='principale'&&this.phase!=='manomissione')return;let c=this.player.hand[i];if(!c)return;if(c.type==='instant'){if(c.cost>this.player.mana)return this.log('❌ Mana insufficiente');this.player.mana-=c.cost;this.player.hand.splice(i,1);this.player.graveyard.push(c);this.resolveInstant('player',c);return this.render()}if(this.phase!=='principale')return;if(c.cost>this.player.mana)return this.log('❌ Mana insufficiente');this.targetMode='summon';this.source=i;this.log(`Scegli una zona iniziale per ${c.name}.`);this.render()},
summonTo(i){if(i<6||i>8||this.board[i].card)return;let c=this.player.hand[this.source];this.player.mana-=c.cost;this.player.hand.splice(this.source,1);this.board[i].card={...c,tired:true,maxResistenza:c.resistenza};this.board[i].owner='player';this.record('play_monster',{card:c.name,cost:c.cost,position:`R${this.board[i].row}C${this.board[i].col}`});this.log(`🎴 Evochi ${c.name}.`);this.targetMode=null;this.source=null;this.render();if(c.etb)this.resolveETB('player',i,c)},
resolveETB(owner,index,c){this.showModal('ETB attivato',`${c.name}: ${c.etb==='draw'?'pesca 1 carta':'pesca 2 carte'}. L’avversario può giocare 1 istantaneo.`,[{text:'Passa',action:()=>{this.hideModal();this.applyETB(owner,c)}}])},applyETB(owner,c){if(c.etb==='draw')this.draw(owner);if(c.etb==='draw2'){this.draw(owner);this.draw(owner)}this.render()},
resolveInstant(owner,c){this.record('play_instant',{owner,card:c.name,effect:c.effect});if(c.effect==='heal_player'){this[owner].hp=Math.min(20,this[owner].hp+c.amount);this.log(`💚 ${owner==='player'?'Tu':'IA'} recupera ${c.amount} PV`)}if(c.effect==='damage_player'){let foe=owner==='player'?'ia':'player';this[foe].hp-=c.amount;this.log(`🔥 ${c.name}: ${c.amount} danni a ${foe==='player'?'te':'IA'}`)}this.checkEnd()},
openUnitMenu(i,e){if(this.phase!=='principale')return;let x=this.board[i];if(x.owner!=='player'||!x.card||x.card.tired)return;let m=document.getElementById('menu');m.innerHTML=`<button onclick="game.beginMove(${i})">🚶 Sposta (1 mana)</button><button onclick="game.beginAttack(${i})">⚔️ Attacca</button>`;m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';m.classList.add('open')},
beginMove(i){document.getElementById('menu').classList.remove('open');if(this.player.mana<1)return this.log('❌ Mana insufficiente');let targets=this.moves(i,'player');if(!targets.length)return this.log('❌ Nessuna casella valida');this.targetMode='move';this.source=i;this.render()},moves(i,owner){let x=this.board[i],out=[],forward=owner==='player'?-3:3;if(x.row+(owner==='player'?-1:1)>=1&&x.row+(owner==='player'?-1:1)<=1&&this.board[i+forward]&&!this.board[i+forward].card)out.push(i+forward);if(x.col>0&&!this.board[i-1].card)out.push(i-1);if(x.col<2&&!this.board[i+1].card)out.push(i+1);return out},
moveTo(i){let f=this.board[this.source],t=this.board[i];t.card=f.card;t.owner=f.owner;f.card=null;f.owner=null;this.player.mana--;this.record('move',{card:t.card.name,from:`R${f.row}C${f.col}`,to:`R${t.row}C${t.col}`,manaCost:1});this.log(`🚶 ${t.card.name} si sposta.`);this.targetMode=null;this.source=null;this.render()},
beginAttack(i){document.getElementById('menu').classList.remove('open');let target=this.attackTarget(i,'player');if(!target)return this.log('❌ Nessun bersaglio valido');this.targetMode='attack';this.source=i;this.render()},attackTarget(i,owner){let x=this.board[i],dir=owner==='player'?-1:1,enemy=owner==='player'?'ia':'player';for(let r=x.row+dir;r>=0&&r<=2;r+=dir){let y=this.board[r*3+x.col];if(y.card)return y.owner===enemy?{type:'unit',index:r*3+x.col}:null}if(x.row===1)return{type:'direct'};return null},
declareAttack(i){let a=this.board[this.source],target=this.attackTarget(this.source,'player');if(!target)return;if(target.type==='unit'&&i!==target.index)return;this.targetMode=null;this.record('attack_declare',{attacker:a.card.name,target:target.type==='direct'?'IA':this.board[target.index].card.name});this.resolveAttack(this.source,target,'player');this.source=null;this.render()},
resolveAttack(source,target,owner){let a=this.board[source];if(!a.card)return;if(target.type==='direct'){let foe=owner==='player'?'ia':'player';this[foe].hp-=a.card.forza;this.log(`💥 ${a.card.name} infligge ${a.card.forza} danni diretti.`);this.record('attack_direct',{owner,attacker:a.card.name,damage:a.card.forza})}else{let d=this.board[target.index];d.card.resistenza-=a.card.forza;this.log(`💥 ${a.card.name} infligge ${a.card.forza} a ${d.card.name}.`);this.record('attack_resolve',{owner,attacker:a.card.name,defender:d.card.name,damage:a.card.forza});if(d.card.resistenza<=0)this.kill(target.index)}a.card.tired=true;this.checkEnd();this.render()},
kill(i){let x=this.board[i],c=x.card;this[x.owner].graveyard.push(c);this.log(`💀 ${c.name} viene distrutto.`);this.record('creature_death',{card:c.name,owner:x.owner,position:`R${x.row}C${x.col}`});x.card=null;x.owner=null},
selectExtra(i){if(this.phase!=='principale')return;this.selectedExtra=i;this.targetMode='sacrifice';this.selectedSacrifices=[];this.log('Seleziona esattamente 2 tue creature da sacrificare.');this.render()},sacrifice(i){let x=this.board[i];if(x.owner!=='player'||!x.card)return;let p=this.selectedSacrifices.indexOf(i);if(p>=0)this.selectedSacrifices.splice(p,1);else if(this.selectedSacrifices.length<2)this.selectedSacrifices.push(i);if(this.selectedSacrifices.length===2){this.targetMode='extraDestination';this.log('Scegli una zona iniziale libera per il mostro Extra Deck.')}this.render()},extraTo(i){if(i<6||i>8||this.board[i].card)return;let c=this.player.extraDeck[this.selectedExtra],names=this.selectedSacrifices.map(j=>this.board[j].card.name);this.selectedSacrifices.forEach(j=>this.kill(j));this.player.extraDeck.splice(this.selectedExtra,1);this.board[i].card={...c,tired:true,maxResistenza:c.resistenza};this.board[i].owner='player';this.record('summon_extra',{card:c.name,cost:0,sacrifices:names,position:`R${this.board[i].row}C${this.board[i].col}`});this.log(`✨ Evochi ${c.name} dall’Extra Deck.`);this.targetMode=null;this.selectedExtra=null;this.selectedSacrifices=[];this.render();if(c.etb)this.resolveETB('player',i,c)},
endTurn(){if(this.phase!=='principale')return;while(this.player.hand.length>7){let i=Math.floor(Math.random()*this.player.hand.length),c=this.player.hand.splice(i,1)[0];this.player.graveyard.push(c);this.record('discard',{owner:'player',card:c.name,reason:'hand_limit'})}this.record('end_turn',{owner:'player'});this.runIATurn()},
runIATurn(){this.phase='ia';this.ia.maxMana=Math.min(10,this.turn);this.ia.mana=this.ia.maxMana;this.board.forEach(x=>{if(x.owner==='ia'&&x.card)x.card.tired=false});this.log('🤖 Turno IA');this.record('turn_start',{who:'ia',mana:this.ia.mana});this.draw('ia');this.iaPlay();this.iaAct();while(this.ia.hand.length>7){let i=Math.floor(Math.random()*this.ia.hand.length);this.ia.graveyard.push(this.ia.hand.splice(i,1)[0])}this.turn++;this.startPlayerTurn()},
iaPlay(){let slot=this.board.slice(0,3).findIndex(x=>!x.card);let choices=this.ia.hand.map((c,i)=>({c,i})).filter(x=>!x.c.type&&x.c.cost<=this.ia.mana).sort((a,b)=>b.c.cost-a.c.cost);if(slot<0||!choices.length)return;let {c,i}=choices[0];this.ia.hand.splice(i,1);this.ia.mana-=c.cost;this.board[slot].card={...c,tired:true,maxResistenza:c.resistenza};this.board[slot].owner='ia';this.record('ia_play_monster',{card:c.name,position:`R0C${slot}`});this.log(`🤖 IA evoca ${c.name}.`)},iaAct(){for(let i=0;i<9;i++){let x=this.board[i];if(x.owner!=='ia'||!x.card)continue;if(!x.card.tired&&this.ia.mana>=1){let next=i+3;if(x.row===0&&!this.board[next].card){this.board[next].card=x.card;this.board[next].owner='ia';x.card=null;x.owner=null;this.ia.mana--;x=this.board[next];i=next;this.record('ia_move',{card:x.card.name,to:`R1C${x.col}`})}let target=this.attackTarget(i,'ia');if(target)this.resolveAttack(i,target,'ia')}}},iaInstant(){let i=this.ia.hand.findIndex(c=>c.type==='instant'&&c.cost<=this.ia.mana);if(i<0)return;let c=this.ia.hand.splice(i,1)[0];this.ia.mana-=c.cost;this.ia.graveyard.push(c);this.resolveInstant('ia',c)},
checkEnd(){if(this.player.hp<=0)this.showModal('Sconfitta','L’IA ha vinto.',[{text:'Nuova partita',action:()=>location.reload()}]);if(this.ia.hp<=0)this.showModal('Vittoria','Hai sconfitto l’IA.',[{text:'Nuova partita',action:()=>location.reload()}])},
render(){document.getElementById('turn').textContent=this.turn;document.getElementById('phase').textContent=this.phase;[['php',this.player.hp],['pm',this.player.mana],['pd',this.player.deck.length],['ph',this.player.hand.length],['ihp',this.ia.hp],['im',this.ia.mana],['id',this.ia.deck.length],['ih',this.ia.hand.length]].forEach(([id,v])=>document.getElementById(id).textContent=v);let b=document.getElementById('board');b.innerHTML='';this.board.forEach((x,i)=>{let e=document.createElement('div');e.className='cell';let valid=(this.targetMode==='summon'&&i>=6&&i<=8&&!x.card)||(this.targetMode==='move'&&this.moves(this.source,'player').includes(i))||(this.targetMode==='attack'&&this.attackTarget(this.source,'player')?.type==='unit'&&this.attackTarget(this.source,'player').index===i)||(this.targetMode==='extraDestination'&&i>=6&&i<=8&&!x.card);if(valid)e.classList.add('valid');if(this.targetMode==='sacrifice'&&x.owner==='player'&&x.card)e.classList.add('sacrifice');if(this.selectedSacrifices.includes(i))e.classList.add('valid');e.innerHTML=`<span class="label">${x.row===0?'IA':x.row===1?'CENTRO':'TU'} · ${x.col+1}</span>`;if(x.card)e.innerHTML+=`<div class="unit ${x.owner==='ia'?'ia':''} ${x.card.tired?'tired':''}"><div class="name">${x.card.name}</div><div class="unitstats"><span class="atk">⚔${x.card.forza}</span> <span class="hp">🛡${x.card.resistenza}</span></div></div>`;e.onclick=ev=>this.cellClick(i,ev);b.append(e)});let h=document.getElementById('hand');h.innerHTML='';this.player.hand.forEach((c,i)=>{let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${c.name}</b><br><small>💎 ${c.cost} ${c.type?'· ⚡':''}</small>${c.forza?`<br>⚔${c.forza} 🛡${c.resistenza}`:''}`;e.onclick=()=>this.playFromHand(i);h.append(e)});let ex=document.getElementById('extra');ex.innerHTML='';this.player.extraDeck.forEach((c,i)=>{let e=document.createElement('div');e.className='card extra';e.innerHTML=`<b>${c.name}</b><br><small>✨ 2 sacrifici</small><br>⚔${c.forza} 🛡${c.resistenza}`;e.onclick=()=>this.selectExtra(i);ex.append(e)})},
cellClick(i,e){document.getElementById('menu').classList.remove('open');if(this.targetMode==='summon')return this.summonTo(i);if(this.targetMode==='move')return this.moves(this.source,'player').includes(i)&&this.moveTo(i);if(this.targetMode==='attack')return this.declareAttack(i);if(this.targetMode==='sacrifice')return this.sacrifice(i);if(this.targetMode==='extraDestination')return this.extraTo(i);if(this.board[i].owner==='player')this.openUnitMenu(i,e)},
showModal(t,txt,buttons){document.getElementById('mtitle').textContent=t;document.getElementById('mtext').textContent=txt;let b=document.getElementById('mbuttons');b.innerHTML='';buttons.forEach(x=>{let q=document.createElement('button');q.textContent=x.text;q.onclick=x.action;b.append(q)});document.getElementById('modal').classList.add('open')},hideModal(){document.getElementById('modal').classList.remove('open')},
saveGame(){let data={version:'2.1',timestamp:new Date().toISOString(),turn:this.turn,phase:this.phase,player:copy(this.player),ia:copy(this.ia),board:copy(this.board),moveHistory:copy(this.history)};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`penombra_partita_turno${this.turn}.json`;a.click();URL.revokeObjectURL(a.href);this.log('💾 Partita salvata.')}
};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('.unit'))document.getElementById('menu').classList.remove('open')});game.init();
</script>
</body></html>
