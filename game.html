<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixxit - Gioco di Carte</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="game-container">
    <!-- Header / Info Avversario -->
    <div class="player-info opponent-info">
      <h2>Avversario AI</h2>
      <div class="hp-bar">HP: <span id="ai-hp">20</span></div>
      <div class="deck-info">Mazzo: <span id="ai-deck-count">10</span></div>
    </div>

    <!-- Campo di Gioco Avversario -->
    <div class="board" id="ai-board">
      <h3>Campo AI</h3>
      <div class="cards-slot" id="ai-board-cards"></div>
    </div>

    <hr>

    <!-- Campo di Gioco Giocatore -->
    <div class="board" id="player-board">
      <h3>Il tuo Campo</h3>
      <div class="cards-slot" id="player-board-cards"></div>
    </div>

    <!-- Info Giocatore e Mana -->
    <div class="player-info">
      <h2>Tu</h2>
      <div class="hp-bar">HP: <span id="player-hp">20</span></div>
      <div class="mana-bar">Mana: <span id="player-mana">1</span>/<span id="max-player-mana">1</span></div>
      <div class="deck-info">Mazzo: <span id="player-deck-count">10</span></div>
    </div>

    <!-- Mano del Giocatore -->
    <div class="hand-container" id="player-hand">
      <!-- Le carte in mano verranno caricate qui via JS -->
    </div>

    <!-- Controlli di Gioco -->
    <div class="controls">
      <button id="end-turn-btn" onclick="endPlayerTurn()">Fine Turno</button>
    </div>
  </div>

  <!-- Modale Draft di Fine Turno -->
  <div id="draft-modal" class="draft-modal" style="display: none;">
    <div class="draft-content">
      <h2>Scegli una carta da aggiungere in fondo al mazzo</h2>
      <div class="draft-choices" id="draft-choices-container">
        <!-- Le 3 opzioni di draft appariranno qui -->
      </div>
      <button onclick="skipDraft()" class="btn-skip">Salta Draft</button>
    </div>
  </div>

  <!-- Logica del Gioco -->
  <script type="module">
    import { generateInitialDeck, generateDraftOptions } from './assets/js/config.js';

    let gameState = {
      playerHp: 20,
      aiHp: 20,
      playerMana: 1,
      maxPlayerMana: 1,
      playerDeck: [],
      playerHand: [],
      playerBoard: [],
      aiBoard: [],
      draftPending: false // Blocca le azioni durante la scelta del draft
    };

    function initGame() {
      gameState.playerDeck = generateInitialDeck();
      // Pesca iniziale di 4 carte
      for (let i = 0; i < 4; i++) {
        if (gameState.playerDeck.length > 0) {
          gameState.playerHand.push(gameState.playerDeck.shift());
        }
      }
      updateUI();
    }

    window.endPlayerTurn = function() {
      if (gameState.draftPending) return; // Blocca se il draft è in corso
      
      // Fine turno giocatore -> Avvia il Draft
      triggerDraft();
    };

    function triggerDraft() {
      gameState.draftPending = true; // Blocca le azioni
      const choices = generateDraftOptions(gameState.playerDeck);
      
      const container = document.getElementById('draft-choices-container');
      container.innerHTML = '';
      
      choices.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card draft-card';
        cardEl.innerHTML = `
          <h4>${card.name}</h4>
          <p>Costo: ${card.cost}</p>
          <p>${card.desc || ''}</p>
        `;
        cardEl.onclick = () => selectDraftCard(card);
        container.appendChild(cardEl);
      });
      
      document.getElementById('draft-modal').style.display = 'flex';
    }

    window.selectDraftCard = function(card) {
      gameState.playerDeck.push(card); // Aggiunge in fondo al mazzo
      closeDraft();
    }

    window.skipDraft = function() {
      closeDraft();
    }

    function closeDraft() {
      document.getElementById('draft-modal').style.display = 'none';
      gameState.draftPending = false;
      // Qui procederebbe il turno dell'AI
    }

    function updateUI() {
      document.getElementById('player-hp').innerText = gameState.playerHp;
      document.getElementById('ai-hp').innerText = gameState.aiHp;
      document.getElementById('player-mana').innerText = gameState.playerMana;
      document.getElementById('max-player-mana').innerText = gameState.maxPlayerMana;
      document.getElementById('player-deck-count').innerText = gameState.playerDeck.length;

      const handContainer = document.getElementById('player-hand');
      handContainer.innerHTML = '';
      gameState.playerHand.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card hand-card';
        cardEl.innerHTML = `
          <strong>${card.name}</strong>
          <div>Costo: ${card.cost}</div>
        `;
        handContainer.appendChild(cardEl);
      });
    }

    initGame();
  </script>
</body>
</html>
