<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Partita della Penombra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        
        .game-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .phase-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.9em;
        }
        
        .phase-name {
            color: #ffd700;
            font-weight: bold;
        }
        
        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        
        .player-stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-box {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }
        
        .stat-label {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
        }
        
        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .cell:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
        }
        
        .cell.highlight {
            animation: highlight 1.5s ease infinite;
            border-color: #ffd700;
        }
        
        .cell.targetable {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        
        @keyframes highlight {
            0%, 100% { background: rgba(255, 255, 255, 0.05); }
            50% { background: rgba(255, 215, 0, 0.2); }
        }
        
        .cell-label {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 0.65em;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .card {
            width: 85%;
            height: 85%;
            background: linear-gradient(145deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #ffd700;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3px;
            font-size: 0.7em;
            transition: transform 0.2s ease;
        }
        
        .card.tired {
            opacity: 0.6;
            filter: grayscale(0.5);
        }
        
        .card-name {
            color: #ffd700;
            font-weight: bold;
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 2px;
        }
        
        .card-stats {
            display: flex;
            gap: 6px;
            font-size: 0.85em;
        }
        
        .stat-forza {
            color: #ff6b6b;
        }
        
        .stat-resistenza {
            color: #4ecdc4;
        }
        
        .hand {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .hand-card {
            min-width: 90px;
            max-width: 90px;
            background: linear-gradient(145deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            padding: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.75em;
        }
        
        .hand-card:hover {
            border-color: #ffd700;
            transform: translateY(-3px);
        }
        
        .hand-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .extra-deck {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .extra-card {
            min-width: 80px;
            max-width: 80px;
            background: linear-gradient(145deg, #3d3d5c 0%, #2a2a40 100%);
            border: 2px solid #ffd700;
            border-radius: 5px;
            padding: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.7em;
        }
        
        .extra-card:hover {
            transform: translateY(-3px);
        }
        
        .extra-card.selected {
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
            max-height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75em;
        }
        
        .log-entry {
            margin-bottom: 3px;
            padding: 2px 5px;
            border-left: 2px solid #ffd700;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #2d2d44 0%, #1a1a2e 100%);
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            max-width: 400px;
            text-align: center;
        }
        
        .modal-title {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 12px;
        }
        
        .modal-text {
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 0.9em;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .context-menu {
            position: fixed;
            background: linear-gradient(145deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 8px;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            display: none;
        }
        
        .context-menu button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 4px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .context-menu button:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        
        button {
            padding: 8px 16px;
            background: linear-gradient(145deg, #ffd700 0%, #ff8c00 100%);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-size: 0.85em;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .end-turn-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            font-size: 1em;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🌙 La Partita della Penombra</h1>
            <div class="phase-indicator">
                Fase: <span class="phase-name" id="phaseName">Inizio</span> | Turno: <span id="turnNumber">1</span>
            </div>
        </div>
        
        <!-- IA Info -->
        <div class="player-bar">
            <div><strong>IA</strong></div>
            <div class="player-stats">
                <div class="stat-box">
                    <div class="stat-value" id="iaHP">20</div>
                    <div class="stat-label">PV</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="iaDeck">20</div>
                    <div class="stat-label">Mazzo</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="iaHand">4</div>
                    <div class="stat-label">Mano</div>
                </div>
            </div>
        </div>
        
        <!-- Board -->
        <div class="board" id="board"></div>
        
        <!-- Player Info -->
        <div class="player-bar">
            <div><strong>Giocatore</strong></div>
            <div class="player-stats">
                <div class="stat-box">
                    <div class="stat-value" id="playerHP">20</div>
                    <div class="stat-label">PV</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="playerMana">1</div>
                    <div class="stat-label">Mana</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="playerDeck">16</div>
                    <div class="stat-label">Mazzo</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="playerHand">4</div>
                    <div class="stat-label">Mano</div>
                </div>
            </div>
        </div>
        
        <!-- Extra Deck -->
        <div class="extra-deck" id="extraDeck"></div>
        
        <!-- Hand -->
        <div class="hand" id="hand"></div>
        
        <!-- Log -->
        <div class="log" id="log"></div>
    </div>
    
    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu"></div>
    
    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Titolo</div>
            <div class="modal-text" id="modalText">Testo</div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>
    
    <!-- End Turn Button -->
    <button class="end-turn-btn" onclick="game.endTurn()">Fine Turno</button>
    
    <script>
        const game = {
            turn: 1,
            phase: 'start',
            player: {
                hp: 20,
                mana: 1,
                maxMana: 1,
                deck: [],
                hand: [],
                graveyard: [],
                extraDeck: []
            },
            ia: {
                hp: 20,
                deck: [],
                hand: [],
                graveyard: [],
                extraDeck: []
            },
            board: [],
            selectedCell: null,
            selectedHandCard: null,
            selectedExtraCard: null,
            targetingMode: null,
            
            init() {
                this.log('=== Inizio Partita ===');
                this.createBoard();
                this.createDeck();
                this.createExtraDeck();
                this.shuffleDeck();
                this.drawCard('player', 4);
                this.drawCard('ia', 4);
                this.updateUI();
                this.startTurn();
            },
            
            createBoard() {
                this.board = [];
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        this.board.push({
                            owner: null,
                            card: null,
                            row: row,
                            col: col,
                            index: row * 3 + col
                        });
                    }
                }
            },
            
            createDeck() {
                const cards = [
                    { name: 'Esploratore', cost: 1, forza: 2, resistenza: 2, etb: null },
                    { name: 'Guerriero', cost: 2, forza: 3, resistenza: 3, etb: null },
                    { name: 'Arciere', cost: 2, forza: 3, resistenza: 2, etb: null },
                    { name: 'Mago', cost: 3, forza: 4, resistenza: 2, etb: 'draw' },
                    { name: 'Paladino', cost: 4, forza: 4, resistenza: 4, etb: null },
                    { name: 'Drago', cost: 6, forza: 6, resistenza: 6, etb: null },
                    { name: 'Cura', cost: 1, type: 'instant', effect: 'heal_unit', amount: 2 },
                    { name: 'Dardo', cost: 1, type: 'instant', effect: 'damage_unit', amount: 2 },
                    { name: 'Scudo', cost: 1, type: 'instant', effect: 'buff_unit', forza: 0, resistenza: 3 },
                    { name: 'Fuoco', cost: 2, type: 'instant', effect: 'damage_player', amount: 3 }
                ];
                
                for (let i = 0; i < 20; i++) {
                    const card = cards[Math.floor(Math.random() * cards.length)];
                    this.player.deck.push({ ...card, id: i });
                    this.ia.deck.push({ ...card, id: i + 100 });
                }
            },
            
            createExtraDeck() {
                const extraCards = [
                    { name: 'Drago Antico', cost: 8, forza: 7, resistenza: 7, etb: 'damage_all' },
                    { name: 'Titano', cost: 7, forza: 6, resistenza: 6, etb: null },
                    { name: 'Serpe Abissale', cost: 6, forza: 5, resistenza: 5, etb: 'draw2' }
                ];
                
                for (let i = 0; i < 5; i++) {
                    const card = extraCards[Math.floor(Math.random() * extraCards.length)];
                    this.player.extraDeck.push({ ...card, id: i + 200 });
                    this.ia.extraDeck.push({ ...card, id: i + 300 });
                }
            },
            
            shuffleDeck() {
                this.shuffleArray(this.player.deck);
                this.shuffleArray(this.ia.deck);
            },
            
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            },
            
            drawCard(who, count = 1) {
                for (let i = 0; i < count; i++) {
                    if (who === 'player') {
                        if (this.player.deck.length === 0) {
                            this.log('⚠️ Mazzo vuoto! Esaurimento: 2 danni');
                            this.player.hp -= 2;
                            this.checkWinCondition();
                            return;
                        }
                        const card = this.player.deck.pop();
                        this.player.hand.push(card);
                        this.log(`📥 Peschi: ${card.name}`);
                    } else {
                        if (this.ia.deck.length === 0) {
                            this.log('⚠️ Mazzo IA vuoto!');
                            this.ia.hp -= 2;
                            this.checkWinCondition();
                            return;
                        }
                        const card = this.ia.deck.pop();
                        this.ia.hand.push(card);
                    }
                }
                this.updateUI();
            },
            
            startTurn() {
                this.phase = 'mana';
                this.player.maxMana = Math.min(10, this.turn);
                this.player.mana = this.player.maxMana;
                this.log(`=== Turno ${this.turn} ===`);
                this.log(`💎 Mana: ${this.player.mana}`);
                
                this.board.forEach(cell => {
                    if (cell.owner === 'player' && cell.card) {
                        cell.card.tired = false;
                    }
                });
                
                this.updateUI();
                this.phase = 'manipulation';
                this.log('🌙 Fase: Manomissione');
                setTimeout(() => {
                    this.phase = 'draw';
                    this.log('📥 Fase: Pesca');
                    this.drawCard('player', 1);
                    this.phase = 'main';
                    this.log('⚔️ Fase: Principale');
                }, 500);
            },
            
            playCard(handIndex) {
                const card = this.player.hand[handIndex];
                
                if (card.type === 'instant') {
                    this.log(`⚡ Giochi istantaneo: ${card.name}`);
                    this.resolveInstant(card);
                    this.player.hand.splice(handIndex, 1);
                    this.player.graveyard.push(card);
                    this.selectedHandCard = null;
                    this.updateUI();
                    return;
                }
                
                if (card.cost > this.player.mana) {
                    this.log('❌ Mana insufficiente');
                    return;
                }
                
                const emptyCells = this.board.filter((cell, index) => 
                    index >= 6 && index <= 8 && cell.card === null
                );
                
                if (emptyCells.length === 0) {
                    this.log('❌ Nessuna casella libera');
                    return;
                }
                
                const targetCell = emptyCells[0];
                
                this.player.mana -= card.cost;
                this.player.hand.splice(handIndex, 1);
                
                targetCell.card = { ...card, tired: true, maxResistenza: card.resistenza };
                targetCell.owner = 'player';
                
                this.log(`🎴 Giochi: ${card.name} (${card.cost} mana)`);
                
                if (card.etb) {
                    this.log(`⚡ Effetto ETB: ${card.etb}`);
                    if (card.etb === 'draw') {
                        this.drawCard('player', 1);
                    }
                }
                
                this.selectedHandCard = null;
                this.updateUI();
            },
            
            resolveInstant(card) {
                switch (card.effect) {
                    case 'heal_unit':
                        this.player.hp = Math.min(20, this.player.hp + card.amount);
                        this.log(`💚 Cura ${card.amount} PV`);
                        break;
                    case 'damage_player':
                        this.ia.hp -= card.amount;
                        this.log(`💥 ${card.amount} danni all'IA`);
                        break;
                }
                this.updateUI();
                this.checkWinCondition();
            },
            
            moveCreature(cellIndex) {
                const cell = this.board[cellIndex];
                if (!cell.card || cell.owner !== 'player') return;
                
                if (this.player.mana < 1) {
                    this.log('❌ Mana insufficiente (serve 1 mana)');
                    return;
                }
                
                const moves = this.getPossibleMoves(cellIndex);
                if (moves.length === 0) {
                    this.log('❌ Nessun movimento possibile');
                    return;
                }
                
                this.targetingMode = 'move';
                this.sourceCell = cellIndex;
                this.highlightCells(moves);
                this.log(`🚶 Scegli una casella (${moves.length} disponibili)`);
            },
            
            getPossibleMoves(cellIndex) {
                const cell = this.board[cellIndex];
                const moves = [];
                const row = cell.row;
                const col = cell.col;
                
                if (row > 0) {
                    const target = this.board[cellIndex - 3];
                    if (target.card === null && target.row >= 1) moves.push(cellIndex - 3);
                }
                
                if (col > 0) {
                    const target = this.board[cellIndex - 1];
                    if (target.card === null) moves.push(cellIndex - 1);
                }
                
                if (col < 2) {
                    const target = this.board[cellIndex + 1];
                    if (target.card === null) moves.push(cellIndex + 1);
                }
                
                return moves;
            },
            
            executeMove(targetIndex) {
                const sourceCell = this.board[this.sourceCell];
                const targetCell = this.board[targetIndex];
                
                targetCell.card = sourceCell.card;
                targetCell.owner = sourceCell.owner;
                sourceCell.card = null;
                sourceCell.owner = null;
                
                this.player.mana -= 1;
                this.log(`🚶 Muove ${targetCell.card.name} in R${targetCell.row}C${targetCell.col}`);
                
                this.targetingMode = null;
                this.sourceCell = null;
                this.updateUI();
            },
            
            attackCreature(cellIndex) {
                const cell = this.board[cellIndex];
                if (!cell.card || cell.owner !== 'player' || cell.card.tired) return;
                
                const target = this.findAttackTarget(cellIndex);
                if (!target) {
                    this.log('❌ Nessun bersaglio valido');
                    return;
                }
                
                if (target.type === 'creature') {
                    this.targetingMode = 'attack_creature';
                    this.sourceCell = cellIndex;
                    this.highlightCells([target.index]);
                    this.log(`⚔️ ${cell.card.name} attacca ${this.board[target.index].card.name}`);
                    this.resolveCombat(cellIndex, target.index);
                } else if (target.type === 'direct') {
                    this.log(`⚔️ ${cell.card.name} attacca direttamente!`);
                    this.ia.hp -= cell.card.forza;
                    cell.card.tired = true;
                    this.updateUI();
                    this.checkWinCondition();
                }
                
                this.targetingMode = null;
                this.sourceCell = null;
            },
            
            findAttackTarget(cellIndex) {
                const cell = this.board[cellIndex];
                const col = cell.col;
                
                for (let row = cell.row - 1; row >= 0; row--) {
                    const index = row * 3 + col;
                    const target = this.board[index];
                    
                    if (target.card) {
                        if (target.owner === 'ia') {
                            return { type: 'creature', index: index };
                        } else {
                            return null;
                        }
                    }
                }
                
                if (cell.row === 1) {
                    return { type: 'direct' };
                }
                
                return null;
            },
            
            resolveCombat(attackerIndex, defenderIndex) {
                const attackerCell = this.board[attackerIndex];
                const defenderCell = this.board[defenderIndex];
                const attacker = attackerCell.card;
                const defender = defenderCell.card;
                
                this.log(`💥 ${attacker.name} (${attacker.forza}) vs ${defender.name} (${defender.resistenza})`);
                
                defender.resistenza -= attacker.forza;
                attackerCell.card.tired = true;
                
                if (defender.resistenza <= 0) {
                    this.log(`💀 ${defender.name} distrutto`);
                    defenderCell.card = null;
                    defenderCell.owner = null;
                }
                
                this.updateUI();
            },
            
            summonExtra(extraIndex) {
                const card = this.player.extraDeck[extraIndex];
                
                if (card.cost > this.player.mana) {
                    this.log('❌ Mana insufficiente');
                    return;
                }
                
                const sacrifices = this.board.filter((cell, index) => 
                    index >= 6 && index <= 8 && cell.card !== null && cell.owner === 'player'
                );
                
                if (sacrifices.length < 2) {
                    this.log('❌ Servono 2 sacrifici');
                    return;
                }
                
                const emptyCells = this.board.filter((cell, index) => 
                    index >= 6 && index <= 8 && cell.card === null
                );
                
                if (emptyCells.length === 0) {
                    this.log('❌ Nessuna casella libera');
                    return;
                }
                
                this.player.mana -= card.cost;
                this.player.extraDeck.splice(extraIndex, 1);
                
                sacrifices[0].card = null;
                sacrifices[0].owner = null;
                sacrifices[1].card = null;
                sacrifices[1].owner = null;
                
                const targetCell = emptyCells[0];
                targetCell.card = { ...card, tired: true, maxResistenza: card.resistenza };
                targetCell.owner = 'player';
                
                this.log(`🎴 Evoci ${card.name} (sacrifici: 2)`);
                
                if (card.etb) {
                    this.log(`⚡ Effetto ETB: ${card.etb}`);
                }
                
                this.selectedExtraCard = null;
                this.updateUI();
            },
            
            endTurn() {
                if (this.phase !== 'main') {
                    this.log('❌ Puoi finire il turno solo nella fase principale');
                    return;
                }
                
                this.log('🌙 Fine turno');
                
                while (this.player.hand.length > 7) {
                    const card = this.player.hand.pop();
                    this.player.graveyard.push(card);
                    this.log(`🗑️ Scarto: ${card.name}`);
                }
                
                this.turn++;
                this.startTurn();
            },
            
            checkWinCondition() {
                if (this.ia.hp <= 0) {
                    this.showModal('🏆 Vittoria!', 'Hai sconfitto l\'IA!', [
                        { text: 'Nuova Partita', action: () => location.reload() }
                    ]);
                } else if (this.player.hp <= 0) {
                    this.showModal('💀 Sconfitta', 'Sei stato sconfitto!', [
                        { text: 'Nuova Partita', action: () => location.reload() }
                    ]);
                }
            },
            
            updateUI() {
                document.getElementById('phaseName').textContent = this.phase;
                document.getElementById('turnNumber').textContent = this.turn;
                document.getElementById('playerHP').textContent = this.player.hp;
                document.getElementById('playerMana').textContent = this.player.mana;
                document.getElementById('playerDeck').textContent = this.player.deck.length;
                document.getElementById('playerHand').textContent = this.player.hand.length;
                document.getElementById('iaHP').textContent = this.ia.hp;
                document.getElementById('iaDeck').textContent = this.ia.deck.length;
                document.getElementById('iaHand').textContent = this.ia.hand.length;
                
                const boardEl = document.getElementById('board');
                boardEl.innerHTML = '';
                this.board.forEach((cell, index) => {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    
                    if (this.targetingMode === 'move' && this.sourceCell !== null) {
                        const moves = this.getPossibleMoves(this.sourceCell);
                        if (moves.includes(index)) {
                            cellEl.classList.add('highlight');
                            cellEl.onclick = () => this.executeMove(index);
                        }
                    }
                    
                    const label = document.createElement('div');
                    label.className = 'cell-label';
                    label.textContent = `${cell.row}${cell.col}`;
                    cellEl.appendChild(label);
                    
                    if (cell.card) {
                        const cardEl = document.createElement('div');
                        cardEl.className = 'card';
                        if (cell.card.tired) cardEl.classList.add('tired');
                        
                        cardEl.innerHTML = `
                            <div class="card-name">${cell.card.name}</div>
                            <div class="card-stats">
                                <span class="stat-forza">⚔️${cell.card.forza}</span>
                                <span class="stat-resistenza">🛡️${cell.card.resistenza}</span>
                            </div>
                        `;
                        
                        cellEl.appendChild(cardEl);
                        cellEl.onclick = (e) => {
                            e.stopPropagation();
                            this.handleCellClick(index);
                        };
                    } else {
                        cellEl.onclick = (e) => {
                            e.stopPropagation();
                            this.handleCellClick(index);
                        };
                    }
                    
                    boardEl.appendChild(cellEl);
                });
                
                const handEl = document.getElementById('hand');
                handEl.innerHTML = '';
                this.player.hand.forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'hand-card';
                    if (this.selectedHandCard === index) cardEl.classList.add('selected');
                    
                    cardEl.innerHTML = `
                        <div class="card-name">${card.name}</div>
                        <div>💎${card.cost}</div>
                        ${card.forza ? `<div>⚔️${card.forza} 🛡️${card.resistenza}</div>` : ''}
                        ${card.type === 'instant' ? `<div>⚡</div>` : ''}
                    `;
                    
                    cardEl.onclick = (e) => {
                        e.stopPropagation();
                        this.handleHandCardClick(index);
                    };
                    
                    handEl.appendChild(cardEl);
                });
                
                const extraEl = document.getElementById('extraDeck');
                extraEl.innerHTML = '';
                this.player.extraDeck.forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'extra-card';
                    if (this.selectedExtraCard === index) cardEl.classList.add('selected');
                    
                    cardEl.innerHTML = `
                        <div class="card-name">${card.name}</div>
                        <div>💎${card.cost}</div>
                        <div>⚔️${card.forza} 🛡️${card.resistenza}</div>
                    `;
                    
                    cardEl.onclick = (e) => {
                        e.stopPropagation();
                        this.handleExtraCardClick(index);
                    };
                    
                    extraEl.appendChild(cardEl);
                });
            },
            
            handleCellClick(index) {
                const cell = this.board[index];
                
                if (this.targetingMode === 'move') {
                    const moves = this.getPossibleMoves(this.sourceCell);
                    if (moves.includes(index)) {
                        this.executeMove(index);
                    }
                    return;
                }
                
                if (cell.card && cell.owner === 'player' && !cell.card.tired && this.phase === 'main') {
                    const menu = document.getElementById('contextMenu');
                    menu.innerHTML = `
                        <button onclick="game.moveCreature(${index})">🚶 Muovi (1 mana)</button>
                        <button onclick="game.attackCreature(${index})">⚔️ Attacca</button>
                    `;
                    
                    const rect = event.target.getBoundingClientRect();
                    menu.style.display = 'block';
                    menu.style.left = rect.left + 'px';
                    menu.style.top = rect.bottom + 'px';
                    
                    setTimeout(() => {
                        menu.style.display = 'none';
                    }, 3000);
                }
            },
            
            handleHandCardClick(index) {
                if (this.selectedHandCard === index) {
                    this.playCard(index);
                } else {
                    this.selectedHandCard = index;
                    this.selectedExtraCard = null;
                    this.updateUI();
                    this.log(`👆 Selezionato: ${this.player.hand[index].name}`);
                }
            },
            
            handleExtraCardClick(index) {
                if (this.selectedExtraCard === index) {
                    this.summonExtra(index);
                } else {
                    this.selectedExtraCard = index;
                    this.selectedHandCard = null;
                    this.updateUI();
                    this.log(`👆 Extra Deck: ${this.player.extraDeck[index].name}`);
                }
            },
            
            log(message) {
                const logEl = document.getElementById('log');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = message;
                logEl.appendChild(entry);
                logEl.scrollTop = logEl.scrollHeight;
            },
            
            showModal(title, text, buttons) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalText').textContent = text;
                
                const buttonsEl = document.getElementById('modalButtons');
                buttonsEl.innerHTML = '';
                buttons.forEach(btn => {
                    const buttonEl = document.createElement('button');
                    buttonEl.textContent = btn.text;
                    buttonEl.onclick = btn.action;
                    buttonsEl.appendChild(buttonEl);
                });
                
                document.getElementById('modal').style.display = 'flex';
            }
        };
        
        document.addEventListener('click', () => {
            document.getElementById('contextMenu').style.display = 'none';
        });
        
        game.init();
    </script>
</body>
</html>
