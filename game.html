<div class="layout"><aside class="logbox"><div class="logtitle">📜 Cronologia della partita</div><div class="log" id="log"></div></aside><main class="main"><div class="head"><h1>🌙 La Partita della Penombra</h1><div class="phase">Turno <b id="turn">1</b> · Fase: <b id="phase">Manomissione</b></div></div><div class="bar enemy"><div class="who"><span class="badge enemy">IA</span><b>Avversario</b></div><div class="stats"><div class="stat"><b id="ihp">20</b>PV</div><div class="stat"><b id="im">0</b>Mana</div><div class="stat"><b id="id">0</b>Mazzo</div><div class="stat"><b id="ih">0</b>Mano</div></div></div><div class="board" id="board"></div><div class="bar mine"><div class="who"><span class="badge mine">TU</span><b>Le tue risorse</b></div><div class="stats"><div class="stat"><b id="php">20</b>PV</div><div class="stat"><b id="pm">1</b>Mana</div><div class="stat"><b id="pd">0</b>Mazzo</div><div class="stat"><b id="ph">0</b>Mano</div></div></div><div class="section">EXTRA DECK · 2 sacrifici, nessun costo mana</div><div class="cards" id="extra"></div><div class="section">MANO</div><div class="cards" id="hand"></div><div class="instant-area" id="instantArea"><div class="instant-title">⚡ Istantanei giocabili — scegli una carta</div><div class="instant-cards" id="instantCards"></div></div></main></div>
<div class="menu" id="menu"></div><div class="modal" id="modal"><div class="dialog"><h2 id="mtitle"></h2><p id="mtext"></p><div id="mbuttons"></div></div></div><div class="banner" id="banner"><strong id="bannerTitle"></strong><span id="bannerPhase"></span></div><div class="floating"><button class="save" onclick="game.saveGame()">💾 Salva partita</button><button onclick="game.endTurn()">Fine turno</button></div>
<script>
const templates=[{name:'Esploratore',cost:1,forza:2,resistenza:2},{name:'Guerriero',cost:2,forza:3,resistenza:3},{name:'Arciere',cost:2,forza:3,resistenza:2},{name:'Mago',cost:3,forza:4,resistenza:2,etb:'draw'},{name:'Paladino',cost:4,forza:4,resistenza:4},{name:'Drago',cost:6,forza:6,resistenza:6},{name:'Cura',cost:1,type:'instant',effect:'heal_player',amount:2},{name:'Fuoco',cost:2,type:'instant',effect:'damage_player',amount:3}];const extraTemplates=[{name:'Titano di Cenere',forza:7,resistenza:7},{name:'Serpe Abissale',forza:5,resistenza:6,etb:'draw2'},{name:'Drago Antico',forza:8,resistenza:6}];const copy=x=>JSON.parse(JSON.stringify(x));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const game={turn:1,phase:'setup',history:[],targetMode:null,source:null,selectedExtra:null,selectedSacrifices:[],player:null,ia:null,board:[],gameOver:false,
init(){this.player=this.makePlayer('player');this.ia=this.makePlayer('ia');this.board=Array.from({length:9},(_,i)=>({row:Math.floor(i/3),col:i%3,owner:null,card:null}));for(let i=0;i<4;i++){this.draw('player');this.draw('ia')}this.startPlayerTurn()},makePlayer(owner){let deck=[];for(let i=0;i<20;i++)deck.push({...copy(templates[Math.floor(Math.random()*templates.length)]),id:owner+i});return{owner,hp:20,mana:0,maxMana:0,deck:shuffle(deck),hand:[],graveyard:[],extraDeck:extraTemplates.map((c,i)=>({...copy(c),id:owner+'x'+i}))}},log(s){let d=document.createElement('div');d.textContent=s;let l=document.getElementById('log');l.append(d);l.scrollTop=l.scrollHeight},record(type,data){this.history.push({turn:this.turn,phase:this.phase,type,data:copy(data),timestamp:new Date().toISOString()})},banner(title,phase){let b=document.getElementById('banner');document.getElementById('bannerTitle').textContent=title;document.getElementById('bannerPhase').textContent=phase;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')},draw(who){let p=this[who];if(!p.deck.length){p.hp-=2;this.log(`⚠️ ${who==='player'?'Tu':'IA'}: mazzo vuoto, -2 PV`);this.record('exhaustion',{who,damage:2});this.checkEnd();return}let c=p.deck.pop();p.hand.push(c);this.record('draw',{who,card:c.name});if(who==='player')this.log(`📥 Peschi ${c.name}`)},startPlayerTurn(){this.phase='mana';this.player.maxMana=Math.min(10,this.turn);this.player.mana=this.player.maxMana;this.board.forEach(x=>{if(x.owner==='player'&&x.card)x.card.tired=false});this.record('turn_start',{who:'player',mana:this.player.mana});this.phase='manomissione';this.banner('IL TUO TURNO','Manomissione');this.log(`🌙 Il tuo turno ${this.turn}: Manomissione`);this.runManipulation(()=>{this.phase='pesca';this.banner('IL TUO TURNO','Pesca');this.draw('player');this.phase='principale';this.banner('IL TUO TURNO','Fase principale / combattimento');this.log('⚔️ Fase principale');this.render()})},canInstant(who){return this[who].hand.some(c=>c.type==='instant'&&c.cost<=this[who].mana)},runManipulation(done){let passes=0,ask=who=>{if(!this.canInstant(who)){passes++;if(passes>=2)return done();return ask(who==='player'?'ia':'player')}if(who==='ia'){this.iaInstant();passes=0;return ask('player')}this.showModal('Manomissione','Vuoi giocare un istantaneo?',[{text:'Passa',action:()=>{this.hideModal();passes++;if(passes>=2)done();else ask('ia')}},{text:'Scegli carta',action:()=>{this.hideModal();this.openInstantArea(()=>{passes=0;ask('ia')})}}])};ask('player')},openInstantArea(done){document.getElementById('instantArea').classList.add('open');this.instantDone=()=>{document.getElementById('instantArea').classList.remove('open');if(done)done()};this.renderInstantCards()},renderInstantCards(){let box=document.getElementById('instantCards');box.innerHTML='';this.player.hand.forEach((c,i)=>{if(c.type!=='instant'||c.cost>this.player.mana)return;let e=document.createElement('button');e.className='instant-card';e.innerHTML=`⚡ <b>${c.name}</b><br><small>${c.cost} mana</small>`;e.onclick=()=>{this.playInstant(i);if(this.instantDone)this.instantDone()};box.append(e)})},playInstant(i){let c=this.player.hand[i];if(!c||c.type!=='instant'||c.cost>this.player.mana)return;this.player.mana-=c.cost;this.player.hand.splice(i,1);this.player.graveyard.push(c);this.resolveInstant('player',c);this.render()},playFromHand(i){if(this.phase!=='principale')return;let c=this.player.hand[i];if(!c)return;if(c.type==='instant')return this.playInstant(i);if(c.cost>this.player.mana)return this.log('❌ Mana insufficiente');this.targetMode='summon';this.source=i;this.log(`Scegli una zona iniziale per ${c.name}.`);this.render()},summonTo(i){if(i<6||i>8||this.board[i].card)return;let c=this.player.hand[this.source];this.player.mana-=c.cost;this.player.hand.splice(this.source,1);this.board[i].card={...c,tired:true,maxResistenza:c.resistenza};this.board[i].owner='player';this.record('play_monster',{card:c.name,cost:c.cost,position:`R${this.board[i].row}C${this.board[i].col}`});this.log(`🎴 Evochi ${c.name}.`);this.targetMode=null;this.source=null;this.render();if(c.etb)this.resolveETB('player',i,c)},resolveETB(owner,index,c){this.showModal('ETB attivato',`${c.name}: ${c.etb==='draw'?'pesca 1 carta':'pesca 2 carte'}.`,[{text:'Continua',action:()=>{this.hideModal();this.applyETB(owner,c)}}])},applyETB(owner,c){if(c.etb==='draw')this.draw(owner);if(c.etb==='draw2'){this.draw(owner);this.draw(owner)}this.render()},resolveInstant(owner,c){this.record('play_instant',{owner,card:c.name,effect:c.effect});if(c.effect==='heal_player'){this[owner].hp=Math.min(20,this[owner].hp+c.amount);this.log(`💚 ${owner==='player'?'Tu':'IA'} recupera ${c.amount} PV`)}if(c.effect==='damage_player'){let foe=owner==='player'?'ia':'player';this[foe].hp-=c.amount;this.log(`🔥 ${c.name}: ${c.amount} danni a ${foe==='player'?'te':'IA'}`)}this.checkEnd()},openUnitMenu(i,e){if(this.phase!=='principale')return;let x=this.board[i];if(x.owner!=='player'||!x.card||x.card.tired)return;let m=document.getElementById('menu');m.innerHTML=`<button onclick="game.beginMove(${i})">🚶 Sposta (1 mana)</button><button onclick="game.beginAttack(${i})">⚔️ Attacca</button>`;m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';m.classList.add('open')},beginMove(i){document.getElementById('menu').classList.remove('open');if(this.player.mana<1)return this.log('❌ Mana insufficiente');let targets=this.moves(i,'player');if(!targets.length)return this.log('❌ Nessuna casella valida');this.targetMode='move';this.source=i;this.render()},moves(i,owner){let x=this.board[i],out=[],forward=owner==='player'?-3:3;if(x.row+(owner==='player'?-1:1)>=1&&x.row+(owner==='player'?-1:1)<=1&&this.board[i+forward]&&!this.board[i+forward].card)out.push(i+forward);if(x.col>0&&!this.board[i-1].card)out.push(i-1);if(x.col<2&&!this.board[i+1].card)out.push(i+1);return out},moveTo(i){let f=this.board[this.source],t=this.board[i];t.card=f.card;t.owner=f.owner;f.card=null;f.owner=null;this.player.mana--;this.record('move',{card:t.card.name,from:`R${f.row}C${f.col}`,to:`R${t.row}C${t.col}`,manaCost:1});this.log(`🚶 ${t.card.name} si sposta.`);this.targetMode=null;this.source=null;this.render()},beginAttack(i){document.getElementById('menu').classList.remove('open');let target=this.attackTarget(i,'player');if(!target)return this.log('❌ Nessun bersaglio valido');this.targetMode='attack';this.source=i;this.render()},attackTarget(i,owner){let x=this.board[i],dir=owner==='player'?-1:1,enemy=owner==='player'?'ia':'player';for(let r=x.row+dir;r>=0&&r<=2;r+=dir){let y=this.board[r*3+x.col];if(y.card)return y.owner===enemy?{type:'unit',index:r*3+x.col}:null}if(x.row===1)return{type:'direct'};return null},declareAttack(i){let a=this.board[this.source],target=this.attackTarget(this.source,'player');if(!target)return;if(target.type==='unit'&&i!==target.index)return;this.targetMode=null;this.record('attack_declare',{attacker:a.card.name,target:target.type==='direct'?'IA':this.board[target.index].card.name});this.resolveAttack(this.source,target,'player');this.source=null;this.render()},resolveAttack(source,target,owner){let a=this.board[source];if(!a.card)return;if(target.type==='direct'){let foe=owner==='player'?'ia':'player';this[foe].hp-=a.card.forza;this.log(`💥 ${a.card.name} infligge ${a.card.forza} danni diretti.`);this.record('attack_direct',{owner,attacker:a.card.name,damage:a.card.forza})}else{let d=this.board[target.index];d.card.resistenza-=a.card.forza;this.log(`💥 ${a.card.name} infligge ${a.card.card?.name||d.card.name}.`);this.record('attack_resolve',{owner,attacker:a.card.name,defender:d.card.name,damage:a.card.forza});if(d.card.resistenza<=0)this.kill(target.index)}a.card.tired=true;this.checkEnd();this.render()},kill(i){let x=this.board[i],c=x.card;this[x.owner].graveyard.push(c);this.log(`💀 ${c.name} viene distrutto.`);this.record('creature_death',{card:c.name,owner:x.owner,position:`R${x.row}C${x.col}`});x.card=null;x.owner=null},selectExtra(i){if(this.ph
